# Standalone configuration; do not merge with the development compose file.
name: gradewise

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app: &app
  image: gradewise-backend:local
  build: ./backend
  # Generated by start.sh; excludes the database owner's password.
  env_file: .env.runtime
  environment: &app-env
    DATABASE_URL: postgresql+asyncpg://app_user:${APP_USER_PASSWORD:?Set APP_USER_PASSWORD}@postgres:5432/feedback
    REDIS_URL: redis://redis:6379/0
    DEBUG: "false"
    USE_MOCKS: "false"
  restart: unless-stopped
  logging: *logging
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: feedback
      POSTGRES_DB: feedback
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:?Set APP_USER_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
      - ./deploy/aws/10_app_role.sql:/docker-entrypoint-initdb.d/10_app_role.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U feedback -d feedback"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 192mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *logging

  api:
    <<: *app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - api_uploads:/app/uploads
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8000/health]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  worker:
    <<: *app
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=1 --max-tasks-per-child=20
    environment:
      <<: *app-env
      TMPDIR: /opt/gradewise/sandbox
    volumes:
      - api_uploads:/app/uploads
      # Preserve the existing code runner. This grants host Docker control:
      # use a dedicated VM, never a shared application host.
      - /var/run/docker.sock:/var/run/docker.sock
      # Host and worker paths must match for sibling sandbox container mounts.
      - /opt/gradewise/sandbox:/opt/gradewise/sandbox
    stop_grace_period: 5m

  beat:
    <<: *app
    command: celery -A app.workers.celery_app beat --loglevel=info --schedule=/state/celerybeat-schedule
    volumes:
      - beat_data:/state

  caddy:
    image: caddy:2-alpine
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN}
      TLS_EMAIL: ${TLS_EMAIL:?Set TLS_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/aws/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

volumes:
  postgres_data:
  redis_data:
  api_uploads:
  beat_data:
  caddy_data:
  caddy_config:
